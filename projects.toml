# Projects to check, as GitHub "owner/name", in groups. The report shows groups
# and the projects in them in this order.
#
# Move projects between groups freely.

[[groups]]
title = "Scrapy and its deps"
repos = [
    "scrapy/scrapy",
    "scrapy/cssselect",
    "scrapy/formerly",
    "scrapy/itemadapter",
    "scrapy/itemloaders",
    "scrapy/parsel",
    "scrapy/protego",
    "scrapy/queuelib",
    "scrapy/w3lib",
    "scrapy/xtractmime",
]

[[groups]]
title = "Scrapy plugins"
repos = [
    "scrapy-plugins/scrapy-download-handlers-incubator",
    "scrapy-plugins/scrapy-playwright",
    "scrapy-plugins/scrapy-spider-metadata",
    "zytedata/duplicate-url-discarder",
    "zytedata/duplicate-url-discarder-rules",
]

[[groups]]
