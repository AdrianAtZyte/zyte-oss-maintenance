# Checks that do not apply to a project, with the reason. They are reported as
# "not applicable" instead of being run:
#
# [skip."owner/name"]
# check-id = "Reason."
# python = "Reason."  # Every check that only applies to Python code.
# released = "Reason."  # Every check that only applies to released projects.

[skip."scrapy/scrapy"]
docs-stable-links = "On docs.scrapy.org, latest is the latest release and master the default branch."

[skip."scrapy/frostwork"]
hatchling = "Rust extension, built with maturin."
twine-check = "Wheels are built per platform by maturin in CI, where twine check runs on them."
mypy = "Runs mypy through make py, in CI."

[skip."scrapy/scrapy-agent-plugin"]
python = "Agent plugin."

[skip."scrapy/unattended-pr-guard"]
python = "GitHub Action."

[skip."zytedata/zyte-oss-maintenance"]
released = "Internal tool."
